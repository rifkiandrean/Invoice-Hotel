
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>HotelFlow - Modern Hotel Billing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      .font-serif {
        font-family: 'Playfair Display', serif;
      }
      
      /* Base A4 Dimensions - Fixed for all devices to ensure correct capture */
      .page-a4 {
        width: 210mm;
        min-height: 296.5mm; 
        margin: 0 auto;
        background: white;
        position: relative;
        box-sizing: border-box;
      }

      /* Container to handle mobile display without shrinking the internal page-a4 */
      .invoice-preview-container {
        width: 100%;
        overflow-x: auto;
        display: flex;
        justify-content: center;
        padding: 1rem;
      }

      /* Custom Animations */
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes slideInUp { from { transform: translateY(1rem); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-8px); }
        75% { transform: translateX(8px); }
      }
      
      .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
      .animate-slide-up { animation: slideInUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
      .animate-shake { animation: shake 0.2s ease-in-out 0s 2; }

      @media print {
        @page {
          size: A4;
          margin: 0;
        }
        body {
          margin: 0;
          padding: 0;
          background: white !important;
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
          color: #000 !important;
        }
        .no-print {
          display: none !important;
        }
        .page-a4 {
          width: 210mm !important;
          height: 297mm !important;
          margin: 0 !important;
          border: none !important;
          box-shadow: none !important;
          border-radius: 0 !important;
          padding: 13mm !important;
          position: absolute !important;
          top: 0 !important;
          left: 0 !important;
          color: #000 !important;
        }
        
        #invoice-content, #invoice-content * {
          color: #000 !important;
        }
        
        #invoice-content thead th {
          color: #fff !important;
        }

        .hide-on-physical-print {
          display: none !important;
          visibility: hidden !important;
          opacity: 0 !important;
        }
        
        thead tr {
          background-color: #000 !important;
          color: white !important;
          -webkit-print-color-adjust: exact !important;
        }
      }

      /* Mobile UI Display Fix - Scales the view but keeps the internal A4 dimensions for capture */
      @media (max-width: 1024px) {
        .invoice-preview-container {
          padding: 0.5rem;
          background-color: #f1f5f9;
        }
        
        /* Instead of resizing the page-a4, we scroll it or scale it in CSS */
        /* To make it fully visible on mobile screens, we allow horizontal scrolling */
        .page-a4 {
          /* We DON'T use width: 100% here as it breaks PDF/Print capture */
          box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
          transform-origin: top center;
          /* Optional: use a smaller scale if you want it to "fit" better on screen */
          /* transform: scale(0.45); (Note: this can make text blurry, better to just scroll) */
        }
      }

      /* Custom scrollbar */
      .custom-scrollbar::-webkit-scrollbar { width: 4px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>

    <script>
      window.process = window.process || { env: { API_KEY: "" } };
    </script>

    <script type="importmap">
    {
      "imports": {
        "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
        "react-dom/": "https://esm.sh/react-dom@19.0.0/",
        "react/": "https://esm.sh/react@19.0.0/",
        "react": "https://esm.sh/react@19.0.0",
        "@google/genai": "https://esm.sh/@google/genai@1.38.0",
        "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.39.7"
      }
    }
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="index.tsx"></script>
  </body>
</html>

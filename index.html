
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>HotelFlow - Modern Hotel Billing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      .font-serif {
        font-family: 'Playfair Display', serif;
      }
      
      /* Base A4 Dimensions */
      .page-a4 {
        width: 210mm;
        min-width: 210mm;
        min-height: 297mm; /* Standard A4 Height */
        margin: 0 auto;
        background: white;
        position: relative;
        box-sizing: border-box;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        border: 1px solid #e2e8f0;
        overflow: hidden;
        margin-bottom: 20px; /* Space between pages on screen */
      }

      /* PDF Generation State: Remove gaps to prevent blank extra pages */
      .pdf-generating .page-a4 {
        margin-bottom: 0 !important;
        border: none !important;
        box-shadow: none !important;
        height: 297mm !important;
        min-height: 297mm !important;
        page-break-after: always !important; /* Critical for html2pdf split */
      }
      
      .pdf-generating .page-a4:last-child {
        page-break-after: avoid !important;
      }

      /* Container Preview */
      .invoice-preview-container {
        width: 100%;
        min-height: 100%;
        background-color: #f1f5f9;
        padding: 40px;
        display: flex;
        flex-direction: column; /* Stack pages vertically */
        align-items: center;
        overflow: auto; 
      }

      @media (max-width: 1024px) {
        .invoice-preview-container {
          padding: 20px;
          align-items: flex-start;
        }
      }

      /* Print Overrides */
      @media print {
        @page {
          size: A4;
          margin: 0;
        }
        
        ::-webkit-scrollbar {
          display: none;
        }
        
        html, body, #root, main {
          height: auto !important;
          overflow: visible !important;
          background: white !important;
        }

        body {
          margin: 0;
          padding: 0;
        }
        
        .no-print {
          display: none !important;
        }
        
        /* Reset containers for print flow */
        .invoice-preview-container {
          padding: 0 !important;
          background: white !important;
          display: block !important;
          width: 100% !important;
          height: auto !important;
          overflow: visible !important;
        }
        
        .page-a4 {
          width: 210mm !important;
          min-width: 210mm !important;
          height: 297mm !important;
          margin: 0 !important;
          border: none !important;
          box-shadow: none !important;
          padding: 13mm !important;
          overflow: hidden !important;
          page-break-after: always; /* Force new page after each .page-a4 */
          print-color-adjust: exact;
          -webkit-print-color-adjust: exact;
        }

        /* Remove margin/break from the very last page to avoid blank sheet at end */
        .page-a4:last-child {
          page-break-after: auto;
          margin-bottom: 0;
        }
        
        .hide-on-physical-print {
          display: none !important;
        }
      }

      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
    </style>

    <script>
      window.process = window.process || { env: { API_KEY: "" } };
    </script>

    <script type="importmap">
    {
      "imports": {
        "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
        "react-dom/": "https://esm.sh/react-dom@19.0.0/",
        "react/": "https://esm.sh/react@19.0.0/",
        "react": "https://esm.sh/react@19.0.0",
        "@google/genai": "https://esm.sh/@google/genai@1.38.0",
        "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.39.7"
      }
    }
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 overflow-hidden">
    <div id="root"></div>
    <script type="module" src="index.tsx"></script>
  </body>
</html>
